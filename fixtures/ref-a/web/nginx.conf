# The bundle is static. The only dynamic path is /api, which is proxied to the
# gateway so the browser never learns any internal hostname.
#
# TLS is not terminated here. In staging and production this container sits
# behind the platform edge tier (ops/README.md); locally you hit :8081 over
# plain http and that is fine.

server {
  listen 80;
  server_name _;

  # Forwarded headers are set upstream of us; pass them through untouched so the
  # gateway's rate limiter sees the real client address.
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location /healthz {
    access_log off;
    return 200 "ok\n";
  }

  location /api/ {
    proxy_pass http://api-gateway:8080/;
    proxy_http_version 1.1;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
