services:
  build:
    build:
      context: .
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    working_dir: /work
    volumes:
      - ../:/work                 # the repo. the only host path mounted.
      # node_modules stay INSIDE the container: the host tree is darwin-arm64
      # (fsevents, @rollup/rollup-darwin-arm64) and would not run on linux.
      # Every workspace needs its own, or npm resolves into the bind mount.
      - topology-node-modules:/work/node_modules
      - topology-nm-core:/work/packages/core/node_modules
      - topology-nm-cli:/work/packages/cli/node_modules
      - topology-nm-viewer:/work/packages/viewer/node_modules
    environment:
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:?run scripts/run-in-docker.sh, not compose directly}
      GIT_AUTHOR_NAME: topology-build
      GIT_AUTHOR_EMAIL: build@localhost
      GIT_COMMITTER_NAME: topology-build
      GIT_COMMITTER_EMAIL: build@localhost
      ROUNDS: ${ROUNDS:-60}
    command: >
      bash -lc "git config --global --add safe.directory /work &&
                npm ci &&
                bash scripts/run.sh --unattended --rounds $${ROUNDS}"

volumes:
  topology-node-modules:
  topology-nm-core:
  topology-nm-cli:
  topology-nm-viewer:
